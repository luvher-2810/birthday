<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm Tra Ngày Sinh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.5s ease;
        }

        .initial-screen {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .special-screen {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ffdde1 100%);
        }

        .container {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #333;
            margin-bottom: 2rem;
            font-size: 1.8rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 500;
        }

        input[type="date"],
        input[type="text"] {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input[type="date"]:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            color: #e74c3c;
            margin-top: 1rem;
            font-size: 0.9rem;
            min-height: 20px;
        }

        .special-message {
            display: none;
        }

        .special-message.active {
            display: block;
            animation: fadeIn 1s ease;
        }

        .special-message h1 {
            color: #d63384;
            font-size: 2.5rem;
            margin-bottom: 2rem;
        }

        .special-message .message {
            font-size: 1.5rem;
            color: #c2185b;
            line-height: 1.8;
            margin: 2rem 0;
            font-weight: 500;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hidden {
            display: none;
        }

        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            display: none;
        }

        .floating-hearts.active {
            display: block;
        }

        .floating-heart {
            position: absolute;
            font-size: 2rem;
            animation: float-up 4s ease-in infinite;
            opacity: 0;
        }

        @keyframes float-up {
            0% {
                opacity: 0;
                transform: translateY(100vh) rotate(0deg);
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) rotate(360deg);
            }
        }
    </style>
</head>
<body class="initial-screen">
    <div class="floating-hearts" id="floatingHearts"></div>
    
    <div class="container">
        <div id="inputForm">
            <h1>Nhập ngày sinh của bạn</h1>
            <div class="input-group">
                <label for="name">Tên của bạn:</label>
                <input type="text" id="name" required>
            </div>
            <div class="input-group">
                <label for="birthdate">Ngày sinh:</label>
                <input type="date" id="birthdate" required>
            </div>
            <button onclick="checkDate()" id="submitBtn">Kiểm tra</button>
            <div class="error-message" id="errorMessage"></div>
        </div>

        <div class="special-message" id="specialMessage">
            <h1>Chúc mừng!</h1>
            <div class="message">
                Cậu là định mệnh của tớ
            </div>
        </div>
    </div>

    <script>
        // ⚠️ THAY URL NÀY BẰNG URL GOOGLE APPS SCRIPT CỦA BẠN
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxYdaR_2q9CVs5zEVL-jv11VqfdSSzcLKXpHaAxkMfSxI8Cz1rcAiGf5cR8HgY_Uhux/exec';

        async function checkDate() {
            const nameInput = document.getElementById('name');
            const birthdateInput = document.getElementById('birthdate');
            const errorMessage = document.getElementById('errorMessage');
            const inputForm = document.getElementById('inputForm');
            const specialMessage = document.getElementById('specialMessage');
            const body = document.body;
            const submitBtn = document.getElementById('submitBtn');

            if (!nameInput.value) {
                errorMessage.textContent = 'Vui lòng nhập tên của bạn.';
                return;
            }

            if (!birthdateInput.value) {
                errorMessage.textContent = 'Vui lòng nhập ngày sinh.';
                return;
            }

            const date = new Date(birthdateInput.value);
            const day = date.getDate();
            const month = date.getMonth() + 1;
            const year = date.getFullYear();

            const isCorrect = (day === 5 && month === 12 && year === 2008);

            // Vô hiệu hóa nút submit
            submitBtn.disabled = true;
            submitBtn.textContent = 'Đang lưu...';

            // Gửi dữ liệu lên Google Sheets
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        name: nameInput.value,
                        birthdate: birthdateInput.value,
                        success: isCorrect
                    })
                });
                console.log('Dữ liệu đã được gửi!');
            } catch (error) {
                console.error('Lỗi khi gửi dữ liệu:', error);
            }

            // Bật lại nút submit
            submitBtn.disabled = false;
            submitBtn.textContent = 'Kiểm tra';

            if (isCorrect) {
                // Ngày đúng - hiển thị màn hình đặc biệt
                inputForm.classList.add('hidden');
                specialMessage.classList.add('active');
                body.classList.remove('initial-screen');
                body.classList.add('special-screen');
                errorMessage.textContent = '';
                
                // Tạo trái tim bay
                const floatingHearts = document.getElementById('floatingHearts');
                floatingHearts.classList.add('active');
                createFloatingHearts();
            } else {
                // Ngày sai
                errorMessage.textContent = 'Xin chia buồn với bạn';
            }
        }

        // Cho phép xác nhận bằng phím Enter
        document.getElementById('birthdate').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                checkDate();
            }
        });

        document.getElementById('name').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                checkDate();
            }
        });

        function createFloatingHearts() {
            const floatingHearts = document.getElementById('floatingHearts');
            const hearts = ['💖', '💗', '💓', '💕', '💘', '❤️', '🧡', '💛', '💚', '💙', '💜'];
            
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
                heart.style.animationDelay = Math.random() * 2 + 's';
                
                floatingHearts.appendChild(heart);
                
                setTimeout(() => {
                    heart.remove();
                }, 6000);
            }, 300);
        }
    </script>
</body>
</html>
